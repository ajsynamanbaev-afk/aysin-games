<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aysin PORTAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">AYSIN PORTAL</div>
        <p style="color: #ffffff !important;">18-sanli orta bilim beriw mektebiniń 6-v klass oqiwshisiniń isi</p>
    </header>

    <main class="games-grid">
        
        <div class="game-card" onclick="openGame('clicker')">
            <div style="font-size: 5rem; margin-top: 20px;">⛏️</div>
            <h3>Maynkraft Kliker ⚔️</h3>
        </div>

        <div class="game-card" onclick="openGame('tictactoe')">
            <div style="font-size: 5rem; margin-top: 20px;">❌</div>
            <h3>iks nól 🤖</h3>
        </div>

        <div class="game-card" onclick="openGame('snake')">
            <div style="font-size: 5rem; margin-top: 20px;">🐍</div>
            <h3>Neonlı jılan 🟢</h3>
        </div>

    </main>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGame()">&times; Oyındı jabıw</span>
            
            <div class="local-game-container">
                
                <div id="game-clicker" class="game-section" style="display:none;">
                    <h2 style="color: #39ff14; font-size: 2rem; margin-bottom: 5px; font-family: sans-serif;">ALMAZLARDI QAZIP AL!</h2>
                    <div style="font-size: 2rem; color: #fff; margin-bottom: 20px; font-family: sans-serif;">Almazlar: <span id="diamonds">0</span></div>
                    <div id="click-object" onclick="clickDiamond()" style="font-size: 7rem; cursor: pointer; transition: transform 0.05s ease; margin: 20px 0; display: inline-block; user-select: none;">💎</div>
                    <br>
                    <button id="upgrade-btn" onclick="buyUpgrade()">Kirkanı kúsheytiw (Bahası: <span id="upgrade-cost">10</span> 💎)</button>
                    <div style="margin-top: 15px; color: #8a99ad; font-family: sans-serif;">qaziw kushi: +<span id="click-power">1</span></div>
                </div>

                <div id="game-tictactoe" class="game-section" style="display:none;">
                    <h2 style="color: #39ff14; font-size: 2rem; margin-bottom: 5px; font-family: sans-serif;">iks nól</h2>
                    
                    <div class="difficulty-container">
                        <button class="diff-btn active" id="diff-easy" onclick="setDifficulty('easy')">Noob 🥱</button>
                        <button class="diff-btn" id="diff-medium" onclick="setDifficulty('medium')">Geymer 😎</button>
                        <button class="diff-btn" id="diff-hard" onclick="setDifficulty('hard')">KIBERSPORT 🤖</button>
                    </div>

                    <div id="tic-status" style="color: #fff; font-size: 1.2rem; margin-bottom: 10px; font-family: sans-serif;">Seniń náwbetiń (Х)</div>
                    
                    <div class="tic-grid">
                        </div>
                    
                    <button id="upgrade-btn" onclick="resetTicTac()">Qaytadan baslaw</button>
                </div>

                <div id="game-snake" class="game-section" style="display:none;">
                    <h2 style="color: #39ff14; font-size: 1.8rem; margin-bottom: 5px; font-family: sans-serif;">Neonlı jılan</h2>
                    <div style="color: #fff; margin-bottom: 10px; font-family: sans-serif;">Esap: <span id="snake-score">0</span> | Basqarıw: Strelkalar</div>
                    <canvas id="snakeCanvas" width="400" height="400"></canvas>
                </div>

            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('gameModal');
        let snakeInterval;

        function openGame(gameType) {
            modal.style.display = "block";
            
            document.getElementById('game-clicker').style.display = "none";
            document.getElementById('game-tictactoe').style.display = "none";
            document.getElementById('game-snake').style.display = "none";
            if(snakeInterval) clearInterval(snakeInterval);

            if(gameType === 'clicker') {
                document.getElementById('game-clicker').style.display = "block";
            } else if(gameType === 'tictactoe') {
                document.getElementById('game-tictactoe').style.display = "block";
                difficulty = "easy";
                document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
                const easyBtn = document.getElementById('diff-easy');
                if(easyBtn) easyBtn.classList.add('active');
                
                setupTicTacGrid();
                resetTicTac();
            } else if(gameType === 'snake') {
                document.getElementById('game-snake').style.display = "block";
                startSnakeGame();
            }
        }

        function closeGame() {
            modal.style.display = "none";
            if(snakeInterval) clearInterval(snakeInterval);
        }

        window.onclick = function(event) { if (event.target == modal) closeGame(); }

        // --- ЛОГИКА 1: КЛИКЕР ---
        let diamonds = 0; let clickPower = 1; let upgradeCost = 10;
        function clickDiamond() {
            diamonds += clickPower;
            document.getElementById('diamonds').textContent = diamonds;
            const el = document.getElementById('click-object');
            el.style.transform = 'scale(0.85)';
            setTimeout(() => el.style.transform = 'scale(1)', 50);
        }
        function buyUpgrade() {
            if (diamonds >= upgradeCost) {
                diamonds -= upgradeCost; clickPower += 1; upgradeCost = Math.round(upgradeCost * 1.8);
                document.getElementById('diamonds').textContent = diamonds;
                document.getElementById('upgrade-cost').textContent = upgradeCost;
                document.getElementById('click-power').textContent = clickPower;
            } else { alert("Almaz jetpeydi! ⛏️"); }
        }

        // --- ЛОГИКА 2: КРЕСТИКИ-НОЛИКИ ---
        let ticBoard = ["","","","","","","","",""];
        let ticActive = true;
        let difficulty = "easy"; 
        const winPatterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function setupTicTacGrid() {
            let grid = document.querySelector('.tic-grid');
            if(grid) {
                grid.style.display = "grid";
                grid.style.gridTemplateColumns = "repeat(3, 1fr)";
                grid.style.gap = "10px";
                grid.style.maxWidth = "300px";
                grid.style.margin = "20px auto";
                
                grid.innerHTML = "";
                for(let i = 0; i < 9; i++) {
                    let cell = document.createElement('div');
                    cell.className = "tic-cell";
                    cell.setAttribute('onclick', `makeTicMove(${i})`);
                    
                    cell.style.backgroundColor = "#1a1c23";
                    cell.style.border = "2px solid #39ff14";
                    cell.style.borderRadius = "8px";
                    cell.style.height = "80px";
                    cell.style.display = "flex";
                    cell.style.alignItems = "center";
                    cell.style.justifyContent = "center";
                    cell.style.fontSize = "2.5rem";
                    cell.style.fontWeight = "bold";
                    cell.style.cursor = "pointer";
                    cell.style.color = "#fff";
                    cell.style.transition = "background-color 0.2s";
                    cell.style.userSelect = "none";
                    
                    cell.onmouseenter = () => { if(ticBoard[i] === "" && ticActive) cell.style.backgroundColor = "#252936"; };
                    cell.onmouseleave = () => { cell.style.backgroundColor = "#1a1c23"; };
                    
                    grid.appendChild(cell);
                }
            }
        }

        function setDifficulty(level) {
            difficulty = level;
            document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
            if(level === 'easy') document.getElementById('diff-easy').classList.add('active');
            if(level === 'medium') document.getElementById('diff-medium').classList.add('active');
            if(level === 'hard') document.getElementById('diff-hard').classList.add('active');
            resetTicTac();
        }

        function makeTicMove(index) {
            if(ticBoard[index] !== "" || !ticActive) return;
            
            ticBoard[index] = "X";
            let cells = document.querySelectorAll('.tic-cell');
            if(cells[index]) {
                cells[index].textContent = "X";
                cells[index].style.color = "#39ff14";
            }
            
            if(checkTicWinner()) return;
            
            ticActive = false;
            document.getElementById('tic-status').textContent = "Bot oylamaqta...";
            
            setTimeout(() => {
                let botMove = getBotMove();
                if(botMove !== null) {
                    ticBoard[botMove] = "O";
                    let cells = document.querySelectorAll('.tic-cell');
                    if(cells[botMove]) {
                        cells[botMove].textContent = "O";
                        cells[botMove].style.color = "#ff3333";
                    }
                }
                
                if(!checkTicWinner()) {
                    ticActive = true;
                    document.getElementById('tic-status').textContent = "Seniń náwbetiń (Х)";
                }
            }, 400);
        }

        function getBotMove() {
            let emptyCells = ticBoard.map((c,i) => c === "" ? i : null).filter(v => v !== null);
            if(emptyCells.length === 0) return null;

            if (difficulty === "easy") {
                return emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            if (difficulty === "medium") {
                for (let pattern of winPatterns) {
                    let oCount = pattern.filter(i => ticBoard[i] === "O").length;
                    let emptyCount = pattern.filter(i => ticBoard[i] === "").length;
                    if (oCount === 2 && emptyCount === 1) return pattern.find(i => ticBoard[i] === "");
                }
                for (let pattern of winPatterns) {
                    let xCount = pattern.filter(i => ticBoard[i] === "X").length;
                    let emptyCount = pattern.filter(i => ticBoard[i] === "").length;
                    if (xCount === 2 && emptyCount === 1) return pattern.find(i => ticBoard[i] === "");
                }
                return emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            let bestScore = -Infinity; let bestMove = emptyCells[0];
            for (let i = 0; i < 9; i++) {
                if (ticBoard[i] === "") {
                    ticBoard[i] = "O";
                    let score = minimax(ticBoard, 0, false);
                    ticBoard[i] = "";
                    if (score > bestScore) { bestScore = score; bestMove = i; }
                }
            }
            return bestMove;
        }

        function minimax(board, depth, isMaximizing) {
            let score = evaluateBoard();
            if (score === 10) return score - depth;
            if (score === -10) return score + depth;
            if (!board.includes("")) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === "") {
                        board[i] = "O"; let score = minimax(board, depth + 1, false); board[i] = "";
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === "") {
                        board[i] = "X"; let score = minimax(board, depth + 1, true); board[i] = "";
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function evaluateBoard() {
            for (let p of winPatterns) {
                if (ticBoard[p[0]] === "O" && ticBoard[p[1]] === "O" && ticBoard[p[2]] === "O") return 10;
                if (ticBoard[p[0]] === "X" && ticBoard[p[1]] === "X" && ticBoard[p[2]] === "X") return -10;
            }
            return 0;
        }

        function checkTicWinner() {
            let score = evaluateBoard();
            if (score === 10) { document.getElementById('tic-status').textContent = "Bot uttı! 🤖"; ticActive = false; return true; }
            if (score === -10) { document.getElementById('tic-status').textContent = "Sen uttıń! 🎉"; ticActive = false; return true; }
            if(!ticBoard.includes("")) { document.getElementById('tic-status').textContent = "Teńbe-teń! 🤝"; ticActive = false; return true; }
            return false;
        }

        function resetTicTac() {
            ticBoard = ["","","","","","","","",""]; 
            ticActive = true;
            document.getElementById('tic-status').textContent = "Seniń náwbetiń (Х)";
            document.querySelectorAll('.tic-cell').forEach(c => { c.textContent = ""; c.style.backgroundColor = "#1a1c23"; });
        }

        // --- ЛОГИКА 3: ЗМЕЙКА ---
        function startSnakeGame() {
            const canvas = document.getElementById('snakeCanvas'); const ctx = canvas.getContext('2d');
            let box = 20; let score = 0; document.getElementById('snake-score').textContent = score;
            let snake = [{x: 10*box, y: 10*box}];
            let food = { x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box };
            let d = "RIGHT";
            
            document.onkeydown = e => {
                if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
                else if(e.keyCode == 38 && d != "DOWN") d = "UP";
                else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
                else if(e.keyCode == 40 && d != "UP") d = "DOWN";
            };

            function draw() {
                ctx.fillStyle = "#0c0d11"; ctx.fillRect(0,0,canvas.width,canvas.height);
                
                ctx.shadowBlur = 15; ctx.shadowColor = "#ff2222";
                ctx.fillStyle = "#ff4444"; ctx.beginPath();
                ctx.arc(food.x + box/2, food.y + box/2, box/2 - 2, 0, Math.PI*2);
                ctx.fill(); ctx.shadowBlur = 0;

                for(let i=0; i<snake.length; i++) {
                    ctx.fillStyle = (i === 0) ? "#39ff14" : "#1e6d0a"; 
                    ctx.beginPath(); let r = 5;
                    let x = snake[i].x, y = snake[i].y, w = box-1, h = box-1;
                    ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r);
                    ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r);
                    ctx.arcTo(x, y, x+w, y, r); ctx.fill();
                }
                
                let snakeX = snake[0].x; let snakeY = snake[0].y;
                if(d == "LEFT") snakeX -= box; if(d == "UP") snakeY -= box;
                if(d == "RIGHT") snakeX += box; if(d == "DOWN") snakeY += box;
                
                if(snakeX == food.x && snakeY == food.y) {
                    score++; document.getElementById('snake-score').textContent = score;
                    food = { x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box };
                } else { snake.pop(); }
                
                let newHead = {x: snakeX, y: snakeY};
                if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                    clearInterval(snakeInterval);
                    setTimeout(() => { alert("Oyin tawısıldı! Esap: " + score); startSnakeGame(); }, 100);
                }
                snake.unshift(newHead);
            }
            function collision(head, array) { for(let i=0; i<array.length; i++) { if(head.x == array[i].x && head.y == array[i].y) return true; } return false; }
            snakeInterval = setInterval(draw, 100);
        }
    </script>
</body>
</html>
